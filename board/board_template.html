<title>CoRL 2026 Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: a conference field guide. Sticky tab + filter rail on top, then a time-rail schedule
   (time column | session card), side drawer for paper detail. Cool slate paper, Austin burnt-orange
   for "liked", ink blue for "flagged", a single blue ramp for magnitude. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --sunk:#e8ecf0; --ink:#14212d; --ink-2:#465564; --ink-3:#6f7d8a;
  --line:#d3dae1; --line-2:#e3e8ed;
  --accent:#b85300; --accent-soft:#f8e7d8; --accent-ink:#ffffff;
  --flag:#2458a8; --flag-soft:#e0e9f7; --hl:#ffe98a;
  --series:#2a78d6; --edge:#b9c3cd; --node:#8996a3;
  --h0:#cde2fb; --h1:#9ec5f4; --h2:#6da7ec; --h3:#3987e5; --h4:#256abf; --h5:#184f95;
  --hi-lo:#14212d; --hi-hi:#ffffff;
  --shadow:0 18px 48px rgba(20,33,45,.18);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151b; --surface:#172029; --sunk:#202b36; --ink:#e5ebf1; --ink-2:#b2bfcb; --ink-3:#8795a3;
  --line:#2d3a47; --line-2:#24303c;
  --accent:#ef8a3c; --accent-soft:#3a2617; --accent-ink:#1a0e05;
  --flag:#77a6ec; --flag-soft:#1d2c44; --hl:#5b4a0c;
  --series:#3987e5; --edge:#3b4957; --node:#6d7c8a;
  --h0:#1d3047; --h1:#184f95; --h2:#2a78d6; --h3:#5598e7; --h4:#86b6ef; --h5:#b7d3f6;
  --hi-lo:#e5ebf1; --hi-hi:#0f151b;
  --shadow:0 18px 48px rgba(0,0,0,.5);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f151b; --surface:#172029; --sunk:#202b36; --ink:#e5ebf1; --ink-2:#b2bfcb; --ink-3:#8795a3;
  --line:#2d3a47; --line-2:#24303c;
  --accent:#ef8a3c; --accent-soft:#3a2617; --accent-ink:#1a0e05;
  --flag:#77a6ec; --flag-soft:#1d2c44; --hl:#5b4a0c;
  --series:#3987e5; --edge:#3b4957; --node:#6d7c8a;
  --h0:#1d3047; --h1:#184f95; --h2:#2a78d6; --h3:#5598e7; --h4:#86b6ef; --h5:#b7d3f6;
  --hi-lo:#e5ebf1; --hi-hi:#0f151b;
  --shadow:0 18px 48px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:150px}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--flag);outline-offset:2px;border-radius:4px}
a{color:var(--flag)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;font-weight:700;letter-spacing:-.01em}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}

/* masthead */
.mast{background:var(--surface);border-bottom:1px solid var(--line-2)}
.mast .wrap{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 24px;padding-block:22px 14px}
.mast h1{font-size:34px;line-height:1.05}
.mast h1 span{color:var(--accent)}
.mast .strap{margin:6px 0 0;color:var(--ink-2);font-size:13.5px}
.mast .byline{margin:5px 0 0;font-size:11.5px;letter-spacing:.02em;color:var(--ink-3)}
.venues{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--ink-2)}
.venues b{font-weight:600;color:var(--ink)}
.sync{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--ink-3);display:inline-block}
.sync[data-s="cloud"] i{background:#0ca30c}
.sync[data-s="saving"] i{background:var(--flag)}
.sync[data-s="error"] i{background:#d03b3b}

/* rail */
.rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-top:6px}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:9px 14px 11px;font-weight:600;font-size:14.5px;color:var(--ink-2);border-bottom:2px solid transparent;white-space:nowrap;text-decoration:none;display:flex;gap:7px;align-items:center}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .ct{font-family:var(--f-mono);font-size:11.5px;font-weight:500;background:var(--sunk);color:var(--ink-2);border-radius:99px;padding:1px 7px}
.filters{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding-block:10px;border-top:1px solid var(--line-2)}
.search{flex:1 1 260px;min-width:0;position:relative}
.search input{width:100%;font:inherit;font-size:14.5px;padding:8px 12px 8px 34px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--ink-3);fill:none;stroke-width:2}
select{font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);max-width:100%}
.chip{font-size:13px;padding:6px 11px;border:1px solid var(--line);border-radius:99px;color:var(--ink-2);display:inline-flex;gap:6px;align-items:center;white-space:nowrap;background:var(--surface)}
.chip:hover{border-color:var(--ink-3);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.chip .mono{font-size:11.5px;opacity:.8}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chk{font-size:13px;color:var(--ink-2);display:inline-flex;gap:6px;align-items:center}
.result{font-size:12.5px;color:var(--ink-3);margin-left:auto;white-space:nowrap}
.linkbtn{font-size:13px;color:var(--flag);text-decoration:underline;text-underline-offset:2px}

main{padding-block:22px 80px}

/* day switcher */
.days{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.day{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;text-align:left;min-width:120px}
.day b{display:block;font-family:var(--f-display);font-size:18px}
.day span{font-size:12px;color:var(--ink-3)}
.day[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.day .mk{font-family:var(--f-mono);font-size:11px;color:var(--accent)}

.dayhead{display:flex;align-items:baseline;gap:12px;margin:30px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.dayhead h2{font-size:24px}
.dayhead span{color:var(--ink-3);font-size:13px}

/* time rail */
.sess{display:grid;grid-template-columns:104px minmax(0,1fr);gap:16px;margin-bottom:18px}
.when{padding-top:14px;text-align:right}
.when time{display:block;font-family:var(--f-mono);font-size:17px;font-weight:500;font-variant-numeric:tabular-nums}
.when span{font-family:var(--f-mono);font-size:12px;color:var(--ink-3)}
.pill{display:inline-block;margin-top:6px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:99px;background:var(--accent);color:var(--accent-ink)}
.pill.next{background:var(--sunk);color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line-2);border-radius:12px;min-width:0}
.card>header,.card>details>summary{padding:14px 16px 10px;display:block}
.card .code{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.card .code b{color:var(--ink);font-weight:500}
.card h3{font-size:18px;line-height:1.25;margin-top:3px}
.card .meta{margin:4px 0 0;font-size:13px;color:var(--ink-2)}
.sess.poster .card{border-color:var(--line)}
details>summary{cursor:pointer;list-style:none}
details>summary::-webkit-details-marker{display:none}
summary .tog{font-size:12.5px;color:var(--flag);margin-top:6px;display:inline-block}
details[open] summary .tog .closed,details:not([open]) summary .tog .opened{display:none}
.room{display:flex;align-items:baseline;gap:10px;padding:10px 16px 6px;border-top:1px solid var(--line-2);background:var(--bg)}
.room b{font-family:var(--f-display);font-size:14.5px}
.room span{font-size:12px;color:var(--ink-3)}
.note{font-size:13px;color:var(--ink-3);margin:2px 0 0}

/* paper rows */
.rows{border-top:1px solid var(--line-2)}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;padding:10px 12px 10px 16px;border-bottom:1px solid var(--line-2);align-items:start}
.rows>.row:last-child{border-bottom:0}
.row.liked{background:linear-gradient(90deg,var(--accent-soft),transparent 70%)}
.row .num{font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--ink-2);min-width:3.4ch;text-align:right;padding-top:2px}
.row.nonum{grid-template-columns:minmax(0,1fr) auto}
.row h4{margin:0;font-size:15px;font-weight:600;line-height:1.35}
.ttl{text-align:left;font-weight:600}
.ttl:hover{color:var(--flag);text-decoration:underline;text-underline-offset:2px}
.by{margin:3px 0 0;font-size:13px;color:var(--ink-2);line-height:1.5}
.au{font-size:13px;color:var(--ink-2)}
.au:hover{color:var(--ink);text-decoration:underline;text-underline-offset:2px}
.au.hit{color:var(--ink);font-weight:600}
.au.fav::after{content:"\2665";color:var(--accent);font-size:.85em;margin-left:3px}
.namerow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.btn.like[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}
.btn.like[aria-pressed="true"] svg{fill:currentColor}
.pnote{width:100%;max-width:640px;min-height:70px;font:inherit;font-size:14px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);resize:vertical;display:block}
.pnote-l{font-size:13px;font-weight:600;display:block;margin:12px 0 6px}
.favs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;margin-bottom:26px}
.fav-card{background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:12px 14px;min-width:0}
.fav-card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.fav-card b{font-family:var(--f-display);font-size:16px}
.fav-card .sub{font-size:12.5px;color:var(--ink-2);margin:2px 0 0}
.fav-card .where{display:block;margin-top:5px}
.fav-card .pnote{min-height:54px;margin-top:8px;font-size:13.5px}
.gnode.fav circle{stroke:var(--accent);stroke-width:3}
.gnode.fav text{fill:var(--ink)}
.more{color:var(--ink-3)}
.tags{margin:6px 0 0;display:flex;flex-wrap:wrap;gap:5px 8px;align-items:center}
.topic{font-size:12px;background:var(--sunk);color:var(--ink-2);padding:2px 8px;border-radius:5px}
.topic:hover{color:var(--ink)}
.badge{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;padding:2px 6px;border-radius:4px;border:1px solid var(--ink);white-space:nowrap}
.badge.oral{background:var(--ink);color:var(--surface)}
.badge.spot{color:var(--ink)}
.where{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-3)}
.mynote{font-size:12.5px;color:var(--ink-2);font-style:italic;margin:5px 0 0}
.abs-t{font-size:12px;color:var(--flag);display:inline-flex;align-items:center;gap:3px}
.abs-t::after{content:"▾";font-size:10px;transition:transform .15s}
.abs-t[aria-expanded="true"]::after{transform:rotate(180deg)}
.abs-t:hover{text-decoration:underline;text-underline-offset:2px}
.abs{margin:7px 0 2px;font-size:13.5px;line-height:1.55;color:var(--ink);max-width:95ch}
.abs.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;color:var(--ink-2);cursor:pointer}
.abs .kw,.dkw{display:block;margin-top:6px;font-size:12px;color:var(--ink-3)}
.abs.clamp .kw{display:none}
.abs mark,.dabs mark{background:var(--accent-soft);color:inherit;border-radius:2px;padding:0 1px}
.dabs{font-size:14.5px;line-height:1.6;margin:0}
/* sentence highlights (yellow highlighter, distinct from the orange search marks) */
.sent.hl{background:var(--hl);color:var(--ink);border-radius:3px;box-shadow:0 0 0 2px var(--hl);-webkit-box-decoration-break:clone;box-decoration-break:clone}
#d-abs .sent{cursor:pointer;border-radius:3px;transition:background .12s}
#d-abs .sent:hover{background:var(--sunk)}
#d-abs .sent.hl:hover{background:var(--hl)}
#d-abs .sent:focus-visible{outline:2px solid var(--flag);outline-offset:1px}
.hlhint{font-size:12px;color:var(--ink-3);margin:8px 0 0}
.hlbadge{font-family:var(--f-mono);font-size:11px;background:var(--hl);color:var(--ink);border-radius:4px;padding:1px 6px;white-space:nowrap}
.hlq{margin:8px 0 2px;display:grid;gap:4px}
.hlq p{margin:0;font-size:13px;line-height:1.5;color:var(--ink);padding-left:10px;border-left:3px solid var(--hl)}
.acts{display:flex;gap:2px}
.ic{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--ink-3)}
.ic:hover{background:var(--sunk);color:var(--ink)}
.ic svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.ic.like[aria-pressed="true"]{color:var(--accent)}
.ic.like[aria-pressed="true"] svg{fill:var(--accent)}
.ic.flag[aria-pressed="true"]{color:var(--flag)}
.ic.flag[aria-pressed="true"] svg{fill:var(--flag)}
.empty{padding:28px 20px;text-align:center;color:var(--ink-2);background:var(--surface);border:1px dashed var(--line);border-radius:12px}
.empty h3{font-size:19px;margin-bottom:6px;color:var(--ink)}
.empty p{margin:6px auto;max-width:52ch}
.btn{font-size:13.5px;font-weight:600;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:inline-flex;gap:8px;align-items:center}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}

/* topics */
.grid2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line-2);border-radius:12px;padding:16px 18px;min-width:0}
.panel h2{font-size:19px}
.panel .sub{font-size:13px;color:var(--ink-3);margin:3px 0 14px}
.bars{display:grid;gap:3px}
.bar{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr);gap:10px;align-items:center;padding:4px 6px;border-radius:6px;text-align:left}
.bar:hover{background:var(--bg)}
.bar[aria-pressed="true"]{background:var(--sunk)}
.bar[aria-pressed="true"] .bl{font-weight:600;color:var(--ink)}
.bl{font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt{display:flex;align-items:center;gap:8px;min-width:0}
.bf{height:12px;border-radius:0 4px 4px 0;background:var(--series);min-width:2px}
.bv{font-family:var(--f-mono);font-size:12px;color:var(--ink);font-variant-numeric:tabular-nums}
.bs{font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.heatwrap{overflow-x:auto}
table.heat{border-collapse:separate;border-spacing:2px;width:100%;min-width:340px}
.heat th{font-weight:500;font-size:12px;color:var(--ink-3);text-align:center;padding:4px 2px}
.heat th.rl{text-align:left;color:var(--ink-2);font-size:13px;font-weight:400;white-space:nowrap;padding-right:8px}
.heat th.rl button{text-align:left}
.heat th.rl button:hover{color:var(--ink);text-decoration:underline}
.heat th .mono{display:block;color:var(--ink);font-size:12px}
.heat td{padding:0}
.heat td button{width:100%;height:30px;border-radius:4px;font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.heat td button:hover{outline:2px solid var(--ink);outline-offset:-2px}
.hz{background:var(--bg);color:var(--ink-3)}
.s0{background:var(--h0);color:var(--hi-lo)}.s1{background:var(--h1);color:var(--hi-lo)}.s2{background:var(--h2);color:var(--hi-lo)}
.s3{background:var(--h3);color:var(--hi-hi)}.s4{background:var(--h4);color:var(--hi-hi)}.s5{background:var(--h5);color:var(--hi-hi)}
:root[data-theme="dark"] .s3,:root[data-theme="dark"] .s4,:root[data-theme="dark"] .s5{color:var(--hi-hi)}
.hleg{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:12px;color:var(--ink-3)}
.hleg i{width:22px;height:10px;border-radius:2px;display:inline-block}
.listhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin:28px 0 12px}
.listhead h2{font-size:24px}
.listhead span{color:var(--ink-3);font-size:13px}
.group{margin-bottom:18px}

/* people */
.people{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;align-items:start}
.side{display:grid;gap:14px;min-width:0}
.side .panel{padding:14px}
.side h3{font-size:15px;margin-bottom:8px}
.alist{display:grid;gap:1px}
.arow{display:flex;justify-content:space-between;gap:10px;padding:6px 8px;border-radius:6px;text-align:left;font-size:13.5px;width:100%}
.arow:hover{background:var(--bg)}
.arow[aria-pressed="true"]{background:var(--sunk);font-weight:600}
.arow .mono{font-size:12px;color:var(--ink-3)}
.side input{width:100%;font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.gtools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:8px}
.graphbox{position:relative;border:1px solid var(--line-2);border-radius:10px;background:var(--bg);overflow:hidden}
#graph{display:block;width:100%;height:520px;touch-action:none}
.glegend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink-2);margin-top:8px}
.glegend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.ghint{position:absolute;right:10px;bottom:8px;font-size:11.5px;color:var(--ink-3);pointer-events:none}
.gnode{cursor:pointer}
.gnode circle{stroke:var(--bg);stroke-width:2;fill:var(--node)}
.gnode.mk circle{fill:var(--accent)}
.gnode.sel circle{fill:var(--ink);stroke:var(--accent);stroke-width:3}
.gnode text{font-size:11px;fill:var(--ink-2);paint-order:stroke;stroke:var(--bg);stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.gnode.sel text{fill:var(--ink);font-weight:600;font-size:12.5px}
.gedge{stroke:var(--edge)}
.dim{opacity:.18}
.acard{margin-top:16px}
.acard h2{font-size:26px}
.astats{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink-2);margin:6px 0 10px}
.co{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}

/* mine */

        <button class="chip" id="t-abs" aria-pressed="false" title="Show a short preview of every abstract">Abstracts</button>
        <button class="chip" id="t-mine" aria-pressed="false"><svg width="13" height="13" viewBox="0 0 24 24" style="fill:currentColor"><use href="#i-heart"/></svg>/<svg width="13" height="13" viewBox="0 0 24 24" style="fill:none;stroke:currentColor;stroke-width:2"><use href="#i-flag"/></svg> only</button>
      </div>
      <span class="result" id="result" aria-live="polite"></span>
      <button class="linkbtn" id="clear" hidden>Clear filters</button>
    </div>
  </div>
</div>

<main class="gut"><div class="wrap" id="view"></div></main>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="d-title" hidden></aside>
<div id="tip" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script>
(function(){
"use strict";
const D = /*__DATA__*/null;
const CAT_LABEL = {
  VLA_Foundation_Models:"VLA & foundation models", World_Models_Video:"World models & video",
  Humanoids_Locomotion:"Humanoids & locomotion", Dexterous_Tactile_Bimanual:"Dexterous, tactile & bimanual",
  Navigation_Driving_Aerial:"Navigation, driving & aerial", Reinforcement_Learning:"Reinforcement learning",
  Imitation_Learning:"Imitation learning", Perception_3D_Representations:"Perception & 3D",
  HRI_Feedback_Interaction:"HRI & human feedback", Data_Simulation_Benchmarks:"Data, simulation & benchmarks",
  Safety_Uncertainty_Failure:"Safety & uncertainty", Planning_Reasoning_Hierarchy:"Planning & reasoning",
  Hardware_Design:"Hardware & design", Other:"Other"
};
const DAYS = [["mon","Monday","Mon","Nov 9","2026-11-09"],["tue","Tuesday","Tue","Nov 10","2026-11-10"],["wed","Wednesday","Wed","Nov 11","2026-11-11"]];
const A = D.A, C = D.C;
const SESS = D.S.slice().sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));
const sess = Object.fromEntries(SESS.map(s=>[s.code,s]));
const sessOrder = Object.fromEntries(SESS.map((s,i)=>[s.code,i]));
const P = D.P.map(r=>({id:r[0],t:r[1],a:r[2],c:r[3],m:r[4],v:r[5],ts:r[6],ps:r[7],n:r[8]}));
const byId = new Map(P.map(p=>[p.id,p]));
const fold = s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const aPapers = A.map(()=>[]);
P.forEach(p=>{ p.a.forEach(i=>aPapers[i].push(p)); p.q = fold(p.t+" | "+p.a.map(i=>A[i]).join(" | ")); p.room = roomOf(p); });
const aFold = A.map(fold);
const catLabel = i=>CAT_LABEL[C[i]] || C[i].replace(/_/g," ");
const catOrder = C.map((_,i)=>i).sort((x,y)=>P.filter(p=>p.c===y).length - P.filter(p=>p.c===x).length);
const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function roomOf(p){ const s=sess[p.ps]; if(!s) return null; const r=s.rooms.find(r=>p.n>=r[0]&&p.n<=r[1]); return r?{name:r[2],floor:r[3]}:null; }
function fmt12(hm){ let [h,m]=hm.split(":").map(Number); const ap=h>=12?"PM":"AM"; h=h%12||12; return h+":"+String(m).padStart(2,"0")+" "+ap; }
function dayShort(code){ const d=DAYS.find(d=>d[0]===sess[code].day); return d?d[2]:""; }

/* ---------- state ---------- */
const st = { view:"schedule", day:null, q:"", terms:[], topic:-1, loc:"", wq:"", wterms:[], wloc:"", wslot:"all", wmine:false, tprev:null, secondary:false, types:new Set(["O","S","P"]), mine:false, author:null, graph:"ego", mineShow:"all" };
const LS_KEY = "corl26-board-marks-v1", LS_UI = "corl26-board-ui-v1", LS_PEOPLE = "corl26-board-people-v1", LS_GOING = "corl26-board-going-v1";
let marks = {}, people = {}, going = {};   // people: author name -> {l:1 (liked), n:"note", t}; going: workshop title -> {g:1, t}
try { marks = JSON.parse(localStorage.getItem(LS_KEY)||"{}")||{}; } catch(e){ marks = {}; }
try { people = JSON.parse(localStorage.getItem(LS_PEOPLE)||"{}")||{}; } catch(e){ people = {}; }
try { going = JSON.parse(localStorage.getItem(LS_GOING)||"{}")||{}; } catch(e){ going = {}; }
const aIdx = new Map(A.map((n,i)=>[n,i]));
const isFav = i=>!!(people[A[i]] && people[A[i]].l);
try { const u = JSON.parse(localStorage.getItem(LS_UI)||"{}"); if(u.day) st.day=u.day; if(typeof u.author==="number") st.author=u.author; if(u.graph) st.graph=u.graph; if(u.showAbs) st.showAbs=true; } catch(e){}
function saveUI(){ try{ localStorage.setItem(LS_UI, JSON.stringify({day:st.day,author:st.author,graph:st.graph,showAbs:!!st.showAbs})); }catch(e){} }
const isMarked = id=>!!(marks[id]&&(marks[id].l||marks[id].f));
const hasHL = id=>!!(marks[id] && marks[id].hl && marks[id].hl.length);
const hasAny = id=>!!(marks[id]&&(marks[id].l||marks[id].f||marks[id].n)) || hasHL(id) || photosOf(id).length>0;
function prune(id, m){ if(!m.l && !m.f && !m.n && !(m.ph && m.ph.length) && !(m.hl && m.hl.length)) delete marks[id]; else marks[id]=m; }

/* ---------- persistence: per-person private doc in the artifact db, browser storage as fallback ---------- */
let docRef=null, inFlight=false, queued=false, pending=false, saveTimer=null, firstSnap=true, retried=false;
function setSync(s, text){ const el=$("#sync"); el.dataset.s=s; el.querySelector("span").textContent=text; }
function persistLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(marks)); localStorage.setItem(LS_PEOPLE, JSON.stringify(people)); localStorage.setItem(LS_GOING, JSON.stringify(going)); }catch(e){} }
function scheduleSave(){
  persistLocal();
  if(!docRef) return;
  pending=true;
  clearTimeout(saveTimer); saveTimer=setTimeout(flush, 600);
}
async function flush(){
  saveTimer=null;
  if(!docRef){ pending=false; return; }
  if(inFlight){ queued=true; return; }
  inFlight=true; setSync("saving","Saving…");
  try{
    await docRef.set({v:1, marks:JSON.parse(JSON.stringify(marks)), people:JSON.parse(JSON.stringify(people)), ws:JSON.parse(JSON.stringify(going)), updated:Date.now()});
    retried=false; setSync("cloud","Likes saved to your account");
  } catch(e){
    if(e && e.code==="unavailable" && !retried){ retried=true; inFlight=false; setTimeout(flush, 1000+Math.random()*1500); return; }
    if(e && (e.code==="invalid_argument"||e.code==="revoked")){ docRef=null; inFlight=false; pending=false; setSync("local","Likes saved in this browser"); return; }
    setSync("error","Couldn't save to your account. Kept in this browser.");
  }
  inFlight=false;
  if(queued){ queued=false; flush(); return; }
  if(!saveTimer) pending=false;
}
(async function connect(){
  if(!(window.claude && typeof window.claude.use==="function")) return;
  try{
    const [db,user,assets] = await Promise.all([window.claude.use("db"), window.claude.use("user"), window.claude.use("assets")]);
    assetsNS = assets || null;
    if(!db || !user) return;
    const uid = await user.id();
    if(!uid) return;
    // Viewers (view-only access) cannot write the store: keep their likes in this browser without an error
    if(typeof user.can==="function" && (await user.can("data.write"))===false) return;
    docRef = db.collection("data/users/"+uid).doc("marks");
    const timer = setTimeout(()=>{ if(firstSnap) setSync("local","Likes saved in this browser"); }, 10000);
    docRef.onSnapshot(snap=>{
      clearTimeout(timer);
      if(snap.metadata && snap.metadata.hasPendingWrites) return;
      const data = snap.exists ? (snap.data()||{}) : {};
      const remote = data.marks||{}, remoteP = data.people||{}, remoteW = data.ws||{};
      if(firstSnap){
        firstSnap=false;
        const merged = Object.assign({}, remote), mergedP = Object.assign({}, remoteP), mergedW = Object.assign({}, remoteW);
        let changed = false;
        for(const k in marks){ if(!merged[k]){ merged[k]=marks[k]; changed=true; } }
        for(const k in people){ if(!mergedP[k]){ mergedP[k]=people[k]; changed=true; } }
        for(const k in going){ if(!mergedW[k]){ mergedW[k]=going[k]; changed=true; } }
        marks = merged; people = mergedP; going = mergedW; persistLocal(); rerenderMarks(); refreshPhotos();
        updateGoingCount();
        if(st.view==="workshops"||st.view==="thursday") render();
        setSync("cloud","Likes saved to your account");
        if(changed) flush();
        return;
      }
      if(inFlight || pending) return;
      if(JSON.stringify(remote)!==JSON.stringify(marks) || JSON.stringify(remoteP)!==JSON.stringify(people) || JSON.stringify(remoteW)!==JSON.stringify(going)){
        const typing = document.activeElement && document.activeElement.dataset && document.activeElement.dataset.person!=null;
        marks=JSON.parse(JSON.stringify(remote)); people=JSON.parse(JSON.stringify(remoteP)); going=JSON.parse(JSON.stringify(remoteW)); persistLocal();
        if(!typing){ rerenderMarks(); refreshPhotos(); updateGoingCount(); if(st.view==="workshops"||st.view==="thursday") render(); }
      }
    }, err=>{ clearTimeout(timer); docRef=null; setSync("local","Likes saved in this browser"); });
  }catch(e){ /* stay local */ }
})();

function toggleMark(id, key){
  const m = Object.assign({}, marks[id]||{});
  if(m[key]) delete m[key]; else { m[key]=1; m.t=Date.now(); }
  prune(id, m);
  scheduleSave(); rerenderMarks(id);
  toast(key==="l" ? (m.l?"Liked":"Like removed") : (m.f?"Flagged to visit":"Flag removed"));
}
function togglePerson(i){
  const k = A[i], p = Object.assign({}, people[k]||{});
  if(p.l) delete p.l; else { p.l=1; p.t=Date.now(); }
  if(!p.l && !p.n) delete people[k]; else people[k]=p;
  scheduleSave();
  toast(p.l ? "Added "+k+" to your people" : "Removed "+k+" from your people");
  document.querySelectorAll('[data-likeperson="'+i+'"]').forEach(b=>{ b.setAttribute("aria-pressed", !!p.l); const s=b.querySelector(".lbl"); if(s) s.textContent = p.l ? "Liked" : "Like person"; });
  document.querySelectorAll('.au[data-author="'+i+'"]').forEach(b=>b.classList.toggle("fav", !!p.l));
  const fl = $("#fav-list"); if(fl) fl.innerHTML = favListHTML();
  if(st.view==="mine") render();
  if(st.view==="people") document.querySelectorAll(".gnode").forEach(g=>{ const d=g.__data__; if(d && d.i===i){ g.classList.toggle("fav", !!p.l); } });
}
function setPersonNote(i, text){
  const k = A[i], p = Object.assign({}, people[k]||{});
  if(text.trim()) p.n=text; else delete p.n;
  if(!p.l && !p.n) delete people[k]; else people[k]=p;
  scheduleSave();
}
function favPeople(){ // [index, entry] for liked people or people with a note, newest first
  return Object.keys(people).filter(k=>aIdx.has(k) && (people[k].l || people[k].n)).map(k=>[aIdx.get(k), people[k]]).sort((a,b)=>(b[1].t||0)-(a[1].t||0));
}
function favListHTML(){
  const f = favPeople();
  if(!f.length) return '<p class="note" style="padding:2px 8px 4px">Select “Like person” on anyone’s card to keep them here.</p>';
  return f.map(([i,e])=>arow(i, e.n ? "note" : aPapers[i].length)).join("");
}
function setNote(id, text){
  const m = Object.assign({}, marks[id]||{});
  if(text.trim()) m.n=text; else delete m.n;
  prune(id, m);
  scheduleSave(); updateMineCount();
}
function rerenderMarks(id){
  updateMineCount();
  const ids = id ? [id] : P.map(p=>p.id);
  ids.forEach(pid=>{
    const m=marks[pid]||{};
    document.querySelectorAll('.row[data-id="'+pid+'"]').forEach(r=>{
      r.classList.toggle("liked",!!m.l);
      const l=r.querySelector(".ic.like"), f=r.querySelector(".ic.flag");
      if(l) l.setAttribute("aria-pressed",m.l?"true":"false");
      if(f) f.setAttribute("aria-pressed",m.f?"true":"false");
    });
  });
  refreshEvBoxes(id && evById.has(id) ? id : (id ? "__none__" : null));
  // views whose content depends on marks re-render; others were patched in place above
  if(st.view==="mine" || (st.mine && (st.view==="schedule"||st.view==="topics")) || (!id && st.view==="people")) render();
  if(!$("#drawer").hidden){
    const m = marks[openId]||{};
    $("#drawer").querySelectorAll(".dacts .btn").forEach(b=>b.setAttribute("aria-pressed", !!m[b.dataset.mark]));
  }
}
function updateMineCount(){ $("#mine-ct").textContent = P.filter(p=>isMarked(p.id) || hasHL(p.id) || photosOf(p.id).length).length + GE.filter(e=>hasAny(e.id)).length; }

/* ---------- photos: stored with the board under your account (assets + private marks doc), else in this browser (IndexedDB) ---------- */
let assetsNS = null;
const localPh = new Map();   // pid -> [{key,url,t}]
const busy = new Set();      // pids with an upload in progress
let idb = null;
const cloudPhotos = ()=> !!(assetsNS && docRef);
function photosOf(pid){
  const cloud = ((marks[pid]||{}).ph||[]).map(x=>({cloud:true, id:x.id, url:"/_blob/"+x.id, t:x.t||0}));
  const loc = (localPh.get(pid)||[]).map(x=>({cloud:false, key:x.key, url:x.url, t:x.t||0}));
  return cloud.concat(loc).sort((a,b)=>a.t-b.t);
}
function idbOpen(){
  return new Promise(res=>{
    try{ const r=indexedDB.open("corl26-board-photos",1); r.onupgradeneeded=()=>r.result.createObjectStore("photos"); r.onsuccess=()=>res(r.result); r.onerror=()=>res(null); }
    catch(e){ res(null); }
  });
}
async function idbLoad(){
  idb = await idbOpen(); if(!idb) return;
  try{
    const req = idb.transaction("photos").objectStore("photos").openCursor();
    req.onsuccess = ()=>{ const c=req.result;
      if(c){ const v=c.value; const b = v.blob || new Blob([v.buf],{type:v.type||"image/jpeg"}); const arr=localPh.get(v.pid)||[]; arr.push({key:c.key, url:URL.createObjectURL(b), t:v.t}); localPh.set(v.pid,arr); c.continue(); }
      else if(localPh.size){ updateMineCount(); refreshPhotos(); }
    };
  }catch(e){}
}
let idbReady = null; // set at init; uploads wait for the local store to open
async function idbPut(pid, blob){
  if(idbReady) await idbReady;
  const buf = await blob.arrayBuffer(); // raw bytes: Blob values in IndexedDB are unreliable on some Safari versions
  return new Promise((res,rej)=>{
    if(!idb) return rej({code:"no_storage"});
    const t=Date.now(), key=pid+":"+t;
    try{
      const tx=idb.transaction("photos","readwrite"); tx.objectStore("photos").put({pid,buf,type:blob.type||"image/jpeg",t}, key);
      tx.oncomplete=()=>{ const arr=localPh.get(pid)||[]; arr.push({key,url:URL.createObjectURL(blob),t}); localPh.set(pid,arr); res(); };
      tx.onerror=()=>rej({code:"no_storage"}); tx.onabort=()=>rej({code:"quota"});
    }catch(e){ rej({code:"no_storage"}); }
  });
}
function idbDel(pid, key){
  return new Promise((res,rej)=>{
    try{ const tx=idb.transaction("photos","readwrite"); tx.objectStore("photos").delete(key);
      tx.oncomplete=()=>{ const arr=(localPh.get(pid)||[]).filter(x=>{ if(x.key===key){ URL.revokeObjectURL(x.url); return false; } return true; }); if(arr.length) localPh.set(pid,arr); else localPh.delete(pid); res(); };
      tx.onerror=()=>rej(tx.error);
    }catch(e){ rej(e); }
  });
}
// Downscale to 2400px on the long side (poster text stays readable, uploads stay small on conference wifi)
function prepImage(file){
  return new Promise(resolve=>{
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = ()=>{
      try{
        const k = Math.min(1, 2400/Math.max(img.naturalWidth, img.naturalHeight));
        const cv = document.createElement("canvas"); cv.width=Math.round(img.naturalWidth*k); cv.height=Math.round(img.naturalHeight*k);
        cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
        cv.toBlob(b=>{ URL.revokeObjectURL(url); resolve(b||file); }, "image/jpeg", 0.85);
      }catch(e){ URL.revokeObjectURL(url); resolve(file); }
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); resolve(file); };
    img.src = url;
  });
}
const sleep = ms=>new Promise(r=>setTimeout(r,ms));
async function addPhotos(pid, files){
  const list = [...files].filter(f=>!f.type || f.type.startsWith("image/"));
  if(!list.length){ toast("Pick a photo (an image file)"); return; }
  busy.add(pid); refreshPhotos(pid);
  let ok=0, msg="";
  for(const file of list){
    try{
      const blob = await prepImage(file);
      const type = /^image\/(jpeg|png|webp|gif)$/.test(blob.type) ? blob.type : "image/jpeg";
      if(cloudPhotos()){
        let r;
        try{ r = await assetsNS.upload(blob, {type}); }
        catch(e){ if(e && e.code==="store_unavailable"){ await sleep(1500); r = await assetsNS.upload(blob, {type}); } else throw e; }
        const m = Object.assign({}, marks[pid]||{}); m.ph = (m.ph||[]).concat([{id:r.id, t:Date.now()}]); prune(pid, m); scheduleSave();
      } else {
        await idbPut(pid, blob);
      }
      ok++;
    }catch(e){
      const c = e && e.code;
      if(c==="not_granted" || c==="capability_disabled" || c==="capability_removed"){
        assetsNS = null; // this view cannot store photos with the board: keep them in this browser
        try{ await idbPut(pid, await prepImage(file)); ok++; continue; }catch(_){}
      }
      msg = c==="too_large" ? "That photo is too large." : (c==="quota_or_state"||c==="quota") ? "Photo storage is full." : c==="rate_limited" ? "Too many uploads at once. Wait a moment and try again." : c==="no_storage" ? "This browser can't store photos (private window?)." : "Couldn't save the photo. Try again.";
    }
  }
  busy.delete(pid);
  refreshPhotos(pid); updateMineCount();
  toast(ok ? (ok>1? ok+" photos added" : "Photo added")+(cloudPhotos()?"":" in this browser") : msg);
}
async function deletePhoto(pid, ph){
  try{
    if(ph.cloud){
      if(assetsNS){ try{ await assetsNS.delete(ph.id); }catch(e){ if(e && e.code==="store_unavailable"){ await sleep(1200); await assetsNS.delete(ph.id); } else if(!(e && e.code==="invalid_request")) throw e; } }
      const m = Object.assign({}, marks[pid]||{}); m.ph = (m.ph||[]).filter(x=>x.id!==ph.id); if(!m.ph.length) delete m.ph; prune(pid, m); scheduleSave();
    } else await idbDel(pid, ph.key);
    toast("Photo deleted");
  }catch(e){ toast("Couldn't delete the photo. Try again."); }
  refreshPhotos(pid); updateMineCount();
}
// Re-render everything that shows photos for one paper (or all)
function refreshPhotos(pid){
  if(st.view==="mine"){ render(); }
  else {
    const sel = pid ? '.row[data-id="'+pid+'"]' : ".row";
    document.querySelectorAll(sel).forEach(r=>{ const p=byId.get(r.dataset.id); if(p) r.outerHTML = rowHTML(p, r.dataset.ctx); });
    refreshEvBoxes(pid || null);
  }
  if(!$("#drawer").hidden && (!pid || pid===openId)){ const box=$("#d-photos"); if(box) box.innerHTML = drawerPhotosHTML(openId); }
}
function thumbsHTML(pid, size){
  const ph = photosOf(pid);
  return ph.map((x,i)=>'<button class="thumb" data-photo="'+pid+'" data-idx="'+i+'" aria-label="Open photo '+(i+1)+' of '+ph.length+'"><img src="'+esc(x.url)+'" alt="" loading="lazy" decoding="async"></button>').join("");
}
function drawerPhotosHTML(pid){
  const where = cloudPhotos() ? "Saved with your board on your account. Other people using this board don't see them." : "Saved in this browser only.";
  return '<div class="photos">'+thumbsHTML(pid)+(busy.has(pid)?'<div class="thumb busy">Saving…</div>':'')
    + '<label class="thumb add"><input class="filein" type="file" accept="image/*" capture="environment" data-pid="'+pid+'" aria-label="Take a photo with the camera"><svg viewBox="0 0 24 24"><use href="#i-cam"/></svg>Take photo</label>'
    + '<label class="thumb add"><input class="filein" type="file" accept="image/*" multiple data-pid="'+pid+'" aria-label="Add photos from your gallery or files"><svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M20.5 16l-5-5-8 8.5"/></svg>From gallery</label></div><p class="note">'+where+'</p>';
}
// lightbox
let lb = null;
function openLightbox(pid, idx){
  const ph = photosOf(pid); if(!ph.length) return;
  lb = {pid, idx:Math.max(0,Math.min(idx,ph.length-1)), confirm:false, full:false, back:document.activeElement};
  renderLightbox(); $("#lightbox").hidden=false; document.body.style.overflow="hidden";
  const c=$("#lightbox [data-lb='close']"); if(c) c.focus();
}
function renderLightbox(){
  const ph = photosOf(lb.pid); if(!ph.length){ closeLightbox(); return; }
  lb.idx = Math.min(lb.idx, ph.length-1);
  const pt = titleOf(lb.pid), x = ph[lb.idx];
  $("#lightbox").innerHTML = '<div class="lb-bar"><span class="t"><span class="mono">'+(lb.idx+1)+' / '+ph.length+'</span> · '+esc(pt)+'</span>'
    + (ph.length>1?'<button data-lb="prev" aria-label="Previous photo">←</button><button data-lb="next" aria-label="Next photo">→</button>':'')
    + (lb.confirm ? '<button class="danger" data-lb="del-yes">Delete this photo</button><button data-lb="del-no">Keep</button>' : '<button data-lb="del">Delete</button>')
    + '<button data-lb="close" aria-label="Close">Close</button></div>'
    + '<div class="lb-img'+(lb.full?' full':'')+'"><img src="'+esc(x.url)+'" alt="Photo '+(lb.idx+1)+' for '+esc(pt)+'" data-lb="zoom"></div>';
}
function closeLightbox(){
  $("#lightbox").hidden=true; $("#lightbox").innerHTML="";
  if($("#drawer").hidden) document.body.style.overflow="";
  const back = lb && lb.back; lb=null;
  if(back && document.contains(back)) back.focus();
}
document.addEventListener("click", async e=>{
  const t = e.target.closest("[data-lb],[data-photo]"); if(!t) return;
  if(t.dataset.photo){ openLightbox(t.dataset.photo, +t.dataset.idx||0); return; }
  if(!lb) return;
  const a = t.dataset.lb, n = photosOf(lb.pid).length;
  if(a==="close") closeLightbox();
  else if(a==="prev"){ lb.idx=(lb.idx-1+n)%n; lb.confirm=false; lb.full=false; renderLightbox(); }
  else if(a==="next"){ lb.idx=(lb.idx+1)%n; lb.confirm=false; lb.full=false; renderLightbox(); }

// Location keys: "v:<venue>" (a whole hotel) or "r:<room>" (a poster room)
function locSess(s){
  if(!st.loc) return true;
  const name = st.loc.slice(2);
  return st.loc[0]==="v" ? s.venue===name : s.rooms.some(r=>r[2]===name);
}
function passesLoc(p){
  if(!st.loc) return true;
  const name = st.loc.slice(2);
  if(st.loc[0]==="r") return !!(p.room && p.room.name===name);
  return !!((p.ts && sess[p.ts].venue===name) || (p.ps && sess[p.ps].venue===name));
}
function passesBase(p){
  if(st.loc && !passesLoc(p)) return false;
  if(st.terms.length && !st.terms.every(t=>p.q.includes(t))) return false;
  if(!st.types.has(p.v)) return false;
  if(st.mine && !isMarked(p.id)) return false;
  return true;
}
function inTopic(p, t){ return p.c===t || (st.secondary && p.m.includes(t)); }
function passes(p){ return passesBase(p) && (st.topic<0 || inTopic(p, st.topic)); }
const filtersActive = ()=> st.terms.length>0 || st.topic>=0 || st.types.size<3 || st.mine || !!st.loc;

/* ---------- abstracts: abstracts.json is published next to the page and loaded in the background ---------- */
let ABS = null, absWaiters = [];
function markTerms(h){
  if(st.terms.length){
    const rx = new RegExp("("+st.terms.filter(t=>t.length>2).map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")","gi");
    if(rx.source!=="()") h = h.replace(rx, "<mark>$1</mark>");
  }
  return h;
}
function absHighlight(text){ return markTerms(esc(text)); }
// split an abstract into sentences, without breaking on "e.g.", "et al.", "Fig.", initials and the like
const ABBR = /(?:\b(?:e\.g|i\.e|et al|vs|cf|etc|approx|Fig|Figs|Eq|Eqs|Sec|Tab|No|Dr|Prof|resp|w\.r\.t|a\.k\.a)\.|(?:^|\s)[A-Z]\.)$/;
function sentences(t){
  const out = [], re = /([.!?]["”’')\]]*)\s+(?=["“(\[]?[A-Z0-9π])/g;
  let start = 0, m;
  while((m = re.exec(t))){
    const cut = m.index + m[1].length, seg = t.slice(start, cut);
    if(ABBR.test(seg)) continue;
    if(seg.trim()) out.push(seg.trim());
    start = re.lastIndex;
  }
  if(t.slice(start).trim()) out.push(t.slice(start).trim());
  return out;
}
// a sentence is remembered by a short hash of its text, so highlights survive edits elsewhere in the abstract
function sHash(s){ const n = fold(s).replace(/\s+/g," ").trim(); let h = 5381; for(let i=0;i<n.length;i++) h = ((h<<5)+h+n.charCodeAt(i))|0; return (h>>>0).toString(36); }
function hlSet(id){ return new Set((marks[id]||{}).hl||[]); }
function absRender(id, text, interactive){
  const on = hlSet(id);
  return sentences(text).map(s=>{
    const h = sHash(s), lit = on.has(h), body = markTerms(esc(s));
    if(interactive) return '<span class="sent'+(lit?' hl':'')+'" data-h="'+h+'" role="button" tabindex="0" aria-pressed="'+lit+'">'+body+'</span>';
    return lit ? '<span class="sent hl">'+body+'</span>' : body;
  }).join(" ");
}
function highlightedSentences(id){
  const x = ABS && ABS[id], on = hlSet(id);
  return x && on.size ? sentences(x.a).filter(s=>on.has(sHash(s))) : [];
}
function toggleHL(id, h){
  const m = Object.assign({}, marks[id]||{});
  const s = new Set(m.hl||[]);
  const added = !s.has(h);
  if(added) s.add(h); else s.delete(h);
  if(s.size) m.hl = [...s]; else delete m.hl;
  if(added) m.t = Date.now();
  prune(id, m); scheduleSave();
  document.querySelectorAll('#d-abs .sent[data-h="'+h+'"]').forEach(el=>{ el.classList.toggle("hl", added); el.setAttribute("aria-pressed", added); });
  if(st.view==="mine") render();
  else document.querySelectorAll('.row[data-id="'+id+'"]').forEach(r=>{ const p=byId.get(id); if(p) r.outerHTML = rowHTML(p, r.dataset.ctx); });
  updateMineCount();
}
function absHTML(id, clamp){
  if(!ABS) return '<p class="abs'+(clamp?' clamp':'')+'" data-absfor="'+id+'">Loading abstract…</p>';
  const x = ABS[id];
  if(!x) return '<p class="abs" data-absfor="'+id+'">No abstract here. <a href="https://openreview.net/forum?id='+encodeURIComponent(id)+'" target="_blank" rel="noopener">Read it on OpenReview ↗</a></p>';
  return '<p class="abs'+(clamp?' clamp':'')+'" data-absfor="'+id+'" title="'+(clamp?'Select to read the whole abstract':'')+'">'+absRender(id, x.a, false)+(x.k?'<span class="kw">Keywords: '+esc(x.k)+'</span>':'')+'</p>';
}
async function loadAbstracts(){
  for(const u of ["abstracts.json","board/abstracts.json"]){
    try{
      const r = await fetch(u);

      ABS = await r.json();

    }catch(e){}
  }

function drawerAbsHTML(id){

/* ---------- Austin clock ---------- */
function austinNow(){
  try{
    const f = new Intl.DateTimeFormat("en-CA",{timeZone:"America/Chicago",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"});
    const o = Object.fromEntries(f.formatToParts(new Date()).map(x=>[x.type,x.value]));
    return {date:o.year+"-"+o.month+"-"+o.day, hm:o.hour+":"+o.minute};
  }catch(e){ return {date:"",hm:""}; }
}

/* ---------- views ---------- */
function render(){
  document.querySelectorAll(".tab").forEach(t=>t.toggleAttribute("aria-current",false));
  const cur=document.querySelector('.tab[data-view="'+st.view+'"]'); if(cur) cur.setAttribute("aria-current","page");
  $("#filters").hidden = !(st.view==="schedule"||st.view==="topics");
  $("#sec-wrap").hidden = st.topic<0;
  $("#clear").hidden = !filtersActive();

  if(st.view==="schedule") v.innerHTML = viewSchedule();
  else if(st.view==="topics") v.innerHTML = viewTopics();

  else if(st.view==="thursday"){ v.innerHTML = viewThursday(); afterThursday(); }
  else if(st.view==="people"){ v.innerHTML = viewPeople(); drawGraph(); }

}

function viewSchedule(){
  const now = austinNow();
  if(!st.day){ const d=DAYS.find(d=>d[4]===now.date); st.day = d?d[0]:"mon"; }
  const fa = filtersActive();
  let html = '<div class="days" role="group" aria-label="Day">';
  DAYS.forEach(d=>{
    const onDay = c=> c && sess[c].day===d[0] && locSess(sess[c]);
    const n = P.filter(p=>passes(p) && (onDay(p.ts) || onDay(p.ps))).length;
    const nm = P.filter(p=>isMarked(p.id) && ((p.ts&&sess[p.ts].day===d[0])||(p.ps&&sess[p.ps].day===d[0]))).length;
    html += '<button class="day" data-day="'+d[0]+'" aria-pressed="'+(st.day===d[0])+'"><b>'+d[2]+' '+d[3].split(" ")[1]+'</b><span>'+n+' papers'+(nm?' · <span class="mk">'+nm+' marked</span>':'')+'</span></button>';
  });
  html += '<button class="day" data-day="all" aria-pressed="'+(st.day==="all")+'"><b>All days</b><span>Nov 9–11</span></button>';
  if(W.length) html += '<a class="day thu" href="#workshops" style="text-decoration:none;color:inherit"><b>Thu 12</b><span>'+W.length+' workshops'+(W.filter(isGoing).length?' · <span class="mk">'+W.filter(isGoing).length+' going</span>':'')+'</span></a>';
  html += '</div>';
  let nextFound = false, any = false;
  DAYS.filter(d=>st.day==="all"||st.day===d[0]).forEach(d=>{
    const gd = (G.days||[]).find(x=>x.day===d[0]);
    const live = gd && gd.live && gd.live.length ? gd.live.map(l=>'<a class="livelink" href="'+esc(l.url)+'" target="_blank" rel="noopener">▶ '+esc(l.label)+'</a>').join("") : "";
    html += '<div class="dayhead"><h2>'+d[1]+', '+d[3]+'</h2><span>'+(d[4]===now.date?"Today":"")+'</span>'+live+'</div>';
    // one timeline per day: paper sessions plus program items (keynotes, panel, breaks…), sorted by start time
    const entries = [];
    SESS.filter(s=>s.day===d[0]).forEach(s=>entries.push({start:s.start, end:s.end, date:s.date, s}));
    GE.filter(e=>e.day===d[0] && evPasses(e)).forEach(e=>entries.push({start:e.start, end:e.end, date:e.date, e}));
    entries.sort((a,b)=>a.start.localeCompare(b.start) || (a.s?-1:1));
    entries.forEach(en=>{
      const pillFor = ()=>{
        if(en.date===now.date && now.hm>=en.start && now.hm<en.end) return '<span class="pill">Now</span>';
        if(!nextFound && (en.date>now.date || en.date===now.date && en.start>now.hm)){ nextFound=true; return '<span class="pill next">Up next</span>'; }
        return "";
      };
      if(en.e){ any = true; html += eventHTML(en.e, pillFor()); return; }
      const s = en.s;
      const isPoster = s.kind==="poster";
      if(!locSess(s)) return;
      const all = P.filter(p=> isPoster ? p.ps===s.code : p.ts===s.code);
      const list = all.filter(passes);
      if(fa && !list.length) return;
      any = true;
      if(isPoster) list.sort((a,b)=>a.n-b.n); else list.sort((a,b)=>a.t.localeCompare(b.t));
      const pill = pillFor();
      const count = fa ? list.length+" of "+all.length : String(all.length);
      html += '<section class="sess '+s.kind+'" id="s-'+s.code+'"><div class="when"><time>'+fmt12(s.start).replace(/ (AM|PM)/,"")+'</time><span>'+fmt12(s.start).slice(-2)+' – '+fmt12(s.end)+'</span>'+pill+'</div><div class="card">';
      if(isPoster){
        const open = fa || st.day!=="all";
        html += '<details'+(open?" open":"")+'><summary><div class="code"><b>'+esc(s.code)+'</b> · '+esc(s.venue)+'</div><h3>'+esc(s.label)+'</h3><p class="meta">'+count+' posters · '+s.rooms.map(r=>esc(r[2])+' ('+esc(r[3])+') #'+r[0]+'–'+r[1]).join(' · ')+'</p><span class="tog"><span class="opened">Hide posters</span><span class="closed">Show posters</span></span></summary>';
        s.rooms.forEach(r=>{
          const rl = list.filter(p=>p.n>=r[0]&&p.n<=r[1]);
          if(!rl.length) return;
          html += '<div class="room"><b>'+esc(r[2])+'</b><span>'+esc(r[3])+' · posters '+r[0]+'–'+r[1]+(fa?' · '+rl.length+' shown':'')+'</span></div><div class="rows">'+rl.map(p=>rowHTML(p,"poster")).join("")+'</div>';
        });
        const rest = list.filter(p=>!p.room);
        if(rest.length) html += '<div class="rows">'+rest.map(p=>rowHTML(p,"poster")).join("")+'</div>';
        html += '</details>';
      } else {
        const ch = chairOf[s.code];
        html += '<header><div class="code"><b>'+esc(s.label)+'</b> · '+esc(s.venue)+'</div><h3>'+esc(s.theme)+'</h3><p class="meta">'+count+' talks'+(ch?' · Session chair: '+peopleHTML(ch):'')+'</p></header><div class="rows">'+list.map(p=>rowHTML(p,"talk")).join("")+'</div>';
      }
      html += '</div></section>';
    });
  });
  if(!any) html += emptyFilters();
  html += '<p class="foot">Schedule from the official CoRL 2026 accepted-papers page. Orals and spotlights are also presented as posters; their poster slot is shown on each talk. Topics are assigned by keyword matching on titles and abstracts, so treat them as a rough guide.</p>';
  return html;
}

function evPasses(e){
  if(["spotlight","oral","poster","workshop"].includes(e.kind)) return false;   // shown through the paper sessions / Workshops tab
  if(st.topic>=0 || st.types.size<3 || st.mine) return false;
  if(st.loc){ if(st.loc[0]==="r") return false; if(!(e.venue||"").includes(st.loc.slice(2))) return false; }
  if(st.terms.length && !st.terms.every(t=>e.q.includes(t))) return false;
  return true;
}
// a name, or several joined by "&": link the ones who are CoRL 2026 authors to their People card
function peopleHTML(names){
  return names.split(/\s*&\s*|\s+and\s+/).map(n=>{ n=n.trim(); const i=aIdx.get(n); return i!=null ? authBtn(i,false) : '<span class="nm">'+esc(n)+'</span>'; }).join(" &amp; ");
}
function paras(t){ return t.split(/\n+/).map(x=>'<p>'+esc(x)+'</p>').join(""); }
// Google Scholar profile search: lists matching profiles (photo, affiliation) so you can pick the right person
function scholarURL(name){ return "https://scholar.google.com/citations?view_op=search_authors&mauthors="+encodeURIComponent(name); }
function scholarLink(name){ return '<a class="sch" href="'+scholarURL(name)+'" target="_blank" rel="noopener" aria-label="Google Scholar profile of '+esc(name)+'">Scholar ↗</a>'; }
function eventHTML(e, pill){
  const when = '<div class="when"><time>'+fmt12(e.start).replace(/ (AM|PM)/,"")+'</time><span>'+fmt12(e.start).slice(-2)+' – '+fmt12(e.end)+'</span>'+pill+'</div>';
  const venue = e.venue ? esc(e.venue) : "";
  if(e.kind==="keynote" || e.kind==="early"){
    const main = e.spk.find(s=>s.role!=="fireside") || null, side = e.spk.filter(s=>s.role==="fireside");
    let h = '<section class="sess ev ev-'+e.kind+'">'+when+'<div class="card evcard"><header><div class="code"><b>'+esc(e.title)+'</b>'+(venue?' · '+venue:'')+'</div>'
      + '<h3>'+esc(main ? main.title : (e.person||e.title))+'</h3>'
      + '<p class="evspk">'+(e.person ? peopleHTML(e.person) : "")+(main && main.aff ? ' <span>'+esc(main.aff)+'</span>' : '')+(e.person ? ' '+scholarLink(e.person) : '')+'</p>'
      + side.map(s=>'<p class="evspk">+ Fireside chat with '+peopleHTML(s.name)+' <span>'+esc(s.aff)+'</span> '+scholarLink(s.name)+'</p>').join("")
      + (e.chair ? '<p class="meta">Session chair: '+peopleHTML(e.chair)+'</p>' : '') + '</header>';
    const body = (main && main.abstract ? '<h4>Abstract</h4>'+paras(main.abstract) : '')
      + e.spk.filter(s=>s.bio).map(s=>'<h4>About '+esc(s.name)+'</h4><p>'+esc(s.bio)+'</p>').join("");
    if(body) h += '<details class="evmore"><summary>Abstract and speaker bio</summary><div class="evbody">'+body+'</div></details>';
    return h + evMineHTML(e) + '</div></section>';
  }
  if(e.kind==="panel"){
    return '<section class="sess ev ev-panel">'+when+'<div class="card evcard"><header><div class="code"><b>Special panel</b>'+(venue?' · '+venue:'')+'</div><h3>The CoRL 2026 debate</h3>'
      + (GPAN.length ? '<p class="evpan">'+GPAN.map(p=>peopleHTML(p.name)+' <span>'+esc(p.aff)+'</span>').join(" · ")+'</p>' : '')
      + (e.chair ? '<p class="meta">Session chair: '+peopleHTML(e.chair)+'</p>' : '') + '</header>' + evMineHTML(e) + '</div></section>';
  }
  if(e.kind==="sponsor"){
    return '<section class="sess ev ev-sponsor">'+when+'<div class="card evcard"><div class="evslim"><div class="code"><b>Sponsor talks</b>'+(venue?' · '+venue:'')+'</div><p class="meta">'+esc(e.title)+(e.chair ? ' · Session chair: '+peopleHTML(e.chair) : '')+'</p></div>' + evMineHTML(e) + '</div></section>';
  }
  // breaks, lunch, welcome, socials, closing: one compact line
  const extra = e.lines.length ? ' · '+esc(e.lines.join(" ")) : "";
  const par = e.parallel ? '<span class="evpar">In parallel: <b>'+esc(e.parallel.title)+'</b>'+(e.parallel.venue?' ('+esc(e.parallel.venue)+')':'')+'</span>' : "";
  return '<section class="sess ev ev-mini ev-'+e.kind+'">'+when+'<div class="evline"><b>'+esc(e.title)+'</b>'+extra+(venue?' <span class="evv">'+venue+'</span>':'')+par+'</div></section>';
}
// program roles of one person (keynote, panel, session chair) for their People card
function programRoles(name){
  const out = [];
  GE.forEach(e=>{
    const t = e.kind==="spotlight"||e.kind==="oral" ? e.title+" · "+(e.lines[0]||"") : e.title;
    if((e.kind==="keynote"||e.kind==="early") && (e.person===name || e.spk.some(s=>s.name===name))){
      const s = spkByName.get(name);
      out.push({what:(s && s.role==="fireside" ? "Fireside chat in " : "")+e.title, detail:s && s.role!=="fireside" ? "“"+s.title+"”" : "", e});
    }
    if(e.kind==="panel" && GPAN.some(p=>p.name===name)) out.push({what:"Panelist · the CoRL 2026 debate", detail:"", e});
    if(e.chair && e.chair.split(/\s*&\s*/).includes(name)) out.push({what:"Session chair · "+t, detail:"", e});
  });
  return out;
}
function programRolesHTML(ai){
  const r = programRoles(A[ai]); if(!r.length) return "";
  return '<h3 style="font-size:17px;margin:18px 0 8px">On the CoRL 2026 program</h3><div class="card wlist">'+r.map(x=>{
    const dn = DAYS.find(d=>d[0]===x.e.day);
    return '<div class="wrow"><div style="min-width:0"><b>'+esc(x.what)+'</b>'+(x.detail?'<span class="where" style="font-family:var(--f-body);font-size:13px;color:var(--ink-2)">'+esc(x.detail)+'</span>':'')
      + '<span class="where">'+(dn?dn[2]+' '+dn[3]:esc(x.e.day))+' · '+fmt12(x.e.start)+' – '+fmt12(x.e.end)+(x.e.venue?' · '+esc(x.e.venue):'')+'</span></div></div>';
  }).join("")+'</div>';
}

function viewTopics(){
  const base = P.filter(passesBase);
  const prim = C.map(()=>0), sec = C.map(()=>0);
  base.forEach(p=>{ prim[p.c]++; p.m.forEach(j=>sec[j]++); });
  const order = catOrder.slice().sort((x,y)=>prim[y]-prim[x] || x-y);
  const max = Math.max(1,...prim);
  let html = '<div class="grid2"><section class="panel"><h2>Papers per topic</h2><p class="sub">Main topic of each paper'+(st.terms.length||st.mine||st.types.size<3?' (current filters applied)':'')+'. Select a topic to list its papers.</p><div class="bars">';
  order.forEach(i=>{
    html += '<button class="bar" data-settopic="'+i+'" aria-pressed="'+(st.topic===i)+'" data-tip="<b>'+esc(catLabel(i))+'</b><br>'+prim[i]+' papers as main topic<br>'+sec[i]+' more list it as a secondary match"><span class="bl">'+esc(catLabel(i))+'</span><span class="bt"><span class="bf" style="width:'+(prim[i]/max*78).toFixed(2)+'%"></span><span class="bv">'+prim[i]+'</span><span class="bs">+'+sec[i]+'</span></span></button>';
  });
  html += '</div><p class="hleg">The number after + counts papers that list the topic as a secondary match.</p></section>';
  // heatmap topic x poster session
  const ps = SESS.filter(s=>s.kind==="poster");
  const cell = {}; let hmax=1;
  order.forEach(i=>ps.forEach(s=>{ const n=base.filter(p=>p.ps===s.code && (p.c===i || st.secondary && p.m.includes(i))).length; cell[i+"|"+s.code]=n; hmax=Math.max(hmax,n); }));
  html += '<section class="panel"><h2>Which day to walk the posters</h2><p class="sub">Posters per topic in each poster session'+(st.secondary?', secondary matches included':'')+'. Select a cell to list them.</p><div class="heatwrap"><table class="heat"><thead><tr><th></th>'+ps.map(s=>'<th>'+esc(s.code)+'<span class="mono">'+dayShort(s.code)+' '+fmt12(s.start).replace(":00","")+'</span></th>').join("")+'</tr></thead><tbody>';
  order.forEach(i=>{
    html += '<tr><th class="rl" scope="row"><button data-settopic="'+i+'">'+esc(catLabel(i))+'</button></th>';
    ps.forEach(s=>{
      const n=cell[i+"|"+s.code]; const k = n? Math.min(5, Math.ceil(n/hmax*6)-1) : -1;
      html += '<td><button class="'+(k<0?"hz":"s"+k)+'" data-settopic="'+i+'" data-jump="'+s.code+'" data-tip="<b>'+esc(catLabel(i))+'</b><br>'+n+' posters in '+esc(s.label)+'<br>'+dayShort(s.code)+' '+esc(s.time)+'" aria-label="'+esc(catLabel(i))+', '+esc(s.label)+': '+n+' posters">'+(n||"–")+'</button></td>';
    });
    html += '</tr>';
  });
  html += '</tbody></table></div><div class="hleg">fewer '+[0,1,2,3,4,5].map(k=>'<i class="s'+k+'"></i>').join("")+' more <span style="margin-left:auto" class="mono">max '+hmax+'</span></div></section></div>';
  if(st.topic<0){
    html += '<div class="listhead"><h2>Pick a topic</h2><span>Select a bar or a cell above, or use the topic menu in the filter bar.</span></div>';
  } else {
    const list = P.filter(passes);
    html += '<div class="listhead" id="topic-list"><h2>'+esc(catLabel(st.topic))+'</h2><span>'+list.length+' papers'+(st.secondary?' including secondary matches':' as main topic')+' · grouped by poster session</span><button class="linkbtn" data-settopic="-1">Show all topics</button></div>';
    if(!list.length) html += emptyFilters();
    ps.forEach(s=>{
      const l = list.filter(p=>p.ps===s.code).sort((a,b)=>a.n-b.n);
      if(!l.length) return;
      html += '<div class="group card" id="g-'+s.code+'"><header><div class="code"><b>'+esc(s.code)+'</b> · '+esc(s.venue)+'</div><h3>'+esc(s.label)+' · '+DAYS.find(d=>d[0]===s.day)[1]+' '+esc(s.time)+'</h3><p class="meta">'+l.length+' posters</p></header><div class="rows">'+l.map(p=>rowHTML(p,"poster")).join("")+'</div></div>';
    });
  }
  return html;
}

/* ---------- people ---------- */
const coCache = new Map();
function coauthors(i){
  if(coCache.has(i)) return coCache.get(i);
  const m = new Map();
  aPapers[i].forEach(p=>p.a.forEach(j=>{ if(j!==i) m.set(j,(m.get(j)||0)+1); }));
  coCache.set(i,m); return m;
}
function markedAuthors(){
  const m = new Map();
  P.forEach(p=>{ if(isMarked(p.id)) p.a.forEach(i=>m.set(i,(m.get(i)||0)+1)); });
  return m;
}

function arow(i, right){ return '<button class="arow" data-author="'+i+'" aria-pressed="'+(st.author===i)+'"><span>'+esc(A[i])+'</span><span class="mono">'+right+'</span></button>'; }
function authorSearch(q){
  const box = $("#aq-res"); if(!box) return;
  const f = fold(q.trim());
  if(!f){ box.innerHTML=""; return; }
  const hits = A.map((_,i)=>i).filter(i=>aFold[i].includes(f)).sort((x,y)=>aPapers[y].length-aPapers[x].length).slice(0,12);
  box.innerHTML = hits.length ? hits.map(i=>arow(i, aPapers[i].length)).join("") : '<p class="note" style="padding:6px 8px">Nobody by that name among CoRL 2026 authors.</p>';

let sim=null, lastW=0;
function drawGraph(){
  const svgEl = $("#graph"); if(!svgEl) return;
  if(sim){ sim.stop(); sim=null; }
  if(!window.d3){ svgEl.outerHTML='<div class="empty" style="margin:16px">The graph library did not load. The lists and the person card still work.</div>'; return; }
  const W = svgEl.clientWidth || 800, H = svgEl.clientHeight || 520; lastW = W;
  const ma = markedAuthors();
  const sel = st.author;
  let ids;
  if(st.graph==="ego"){
    const co = [...coauthors(sel).entries()].sort((a,b)=>b[1]-a[1]||aPapers[b[0]].length-aPapers[a[0]].length).slice(0,70).map(e=>e[0]);
    ids = [sel, ...co];
  } else {
    ids = A.map((_,i)=>i).filter(i=>aPapers[i].length>=3 || isFav(i));
    if(!ids.includes(sel)) ids.push(sel);
  }
  const set = new Set(ids);
  const nodes = ids.map(i=>({i, n:aPapers[i].length, r:3.5+2.3*Math.sqrt(aPapers[i].length), mk:ma.has(i)}));
  const ew = new Map();
  // papers with very long author lists would link everyone to everyone; they only link to the selected person
  const BIG = 12;
  ids.forEach(i=>aPapers[i].forEach(p=>p.a.forEach(j=>{ if(j>i && set.has(j) && (p.a.length<=BIG || i===sel || j===sel)){ const k=i+"|"+j; ew.set(k,(ew.get(k)||0)+1); } })));
  // pairs counted once per paper per endpoint i, so each shared paper counts once
  const links = [...ew.entries()].map(([k,w])=>{ const [s,t]=k.split("|").map(Number); return {source:s,target:t,w}; });
  $("#g-info").textContent = nodes.length+" people · "+links.length+" links";
  const svg = d3.select(svgEl); svg.selectAll("*").remove();
  svg.attr("viewBox",[0,0,W,H]);
  const g = svg.append("g");
  const ego = st.graph==="ego";
  const center = nodes.find(n=>n.i===sel); if(ego && center){ center.fx=W/2; center.fy=H/2; }
  sim = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(links).id(d=>d.i).distance(l=> ego ? 70+ (l.source.i===sel||l.target.i===sel? 40:0) : 34).strength(l=>Math.min(1, (ego?.15:.25)*l.w)))
    .force("charge", d3.forceManyBody().strength(ego?-260:-48).distanceMax(ego?260:400))
    .force("collide", d3.forceCollide(d=>d.r+(ego?6:2)))
    .force("x", d3.forceX(W/2).strength(ego?.04:.07)).force("y", d3.forceY(H/2).strength(ego?.06:.09));
  const lk = g.append("g").selectAll("line").data(links).join("line").attr("class","gedge").attr("stroke-width",d=>Math.min(4,.8+(d.w-1)*.9)).attr("stroke-opacity",ego?.75:.55);
  const nd = g.append("g").selectAll("g").data(nodes).join("g").attr("class",d=>"gnode"+(d.i===sel?" sel":"")+(d.mk?" mk":"")+(isFav(d.i)?" fav":""));
  nd.append("circle").attr("r",d=>d.r);
  const showLabel = d => isFav(d.i) || (ego ? (d.i===sel || nodes.length<=36 || d.n>=2 || d.mk) : (d.i===sel || d.n>=7 || d.mk));
  nd.filter(showLabel).append("text").attr("x",d=>d.r+3).attr("y",4).text(d=>A[d.i]);
  const adj = new Map(nodes.map(n=>[n.i,new Set([n.i])]));
  links.forEach(l=>{ const s=l.source.i??l.source, t=l.target.i??l.target; adj.get(s).add(t); adj.get(t).add(s); });
  nd.on("mouseenter",(e,d)=>{
      const nb = adj.get(d.i);
      nd.classed("dim",x=>!nb.has(x.i)); lk.classed("dim",l=>l.source.i!==d.i&&l.target.i!==d.i);
      const sh = d.i===sel? "" : (coauthors(sel).get(d.i) ? "<br>"+coauthors(sel).get(d.i)+" paper(s) with "+esc(A[sel]) : "");
      tip(e, "<b>"+esc(A[d.i])+"</b>"+(isFav(d.i)?" ♥":"")+"<br>"+d.n+" paper"+(d.n>1?"s":"")+" at CoRL"+(ma.get(d.i)?" · "+ma.get(d.i)+" marked by you":"")+sh);
    })
    .on("mousemove",e=>moveTip(e))
    .on("mouseleave",()=>{ nd.classed("dim",false); lk.classed("dim",false); hideTip(); })
    .on("click",(e,d)=>{ hideTip(); selectAuthor(d.i, false); });
  nd.call(d3.drag()
    .on("start",(e,d)=>{ if(!e.active) sim.alphaTarget(.2).restart(); d.fx=d.x; d.fy=d.y; })
    .on("drag",(e,d)=>{ d.fx=e.x; d.fy=e.y; })
    .on("end",(e,d)=>{ if(!e.active) sim.alphaTarget(0); if(!(ego&&d.i===sel)){ d.fx=null; d.fy=null; } }));
  const zoom = d3.zoom().scaleExtent([.25,5]).on("zoom",e=>g.attr("transform",e.transform));
  svg.call(zoom);
  const tick = ()=>{ lk.attr("x1",d=>d.source.x).attr("y1",d=>d.source.y).attr("x2",d=>d.target.x).attr("y2",d=>d.target.y); nd.attr("transform",d=>"translate("+d.x+","+d.y+")"); };
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  sim.stop(); for(let k=0;k<(reduce?300:160);k++) sim.tick();
  tick();
  if(!ego){ // fit overview
    const xs=nodes.map(n=>n.x), ys=nodes.map(n=>n.y);
    const x0=Math.min(...xs)-20,x1=Math.max(...xs)+90,y0=Math.min(...ys)-20,y1=Math.max(...ys)+20;
    const k=Math.min(2, .95*Math.min(W/(x1-x0), H/(y1-y0)));
    svg.call(zoom.transform, d3.zoomIdentity.translate(W/2-k*(x0+x1)/2, H/2-k*(y0+y1)/2).scale(k));
    if(center){ /* keep selected visible */ }
  }
  sim.on("tick",tick);
  if(!reduce) sim.alpha(.15).restart();
}
function selectAuthor(i, scroll){
  st.author=i; saveUI();
  if(st.view!=="people"){ location.hash="people"; return; }
  render();
  if(scroll!==false) window.scrollTo({top:0});
}

const W = (D.W||[]).map((w,i)=>Object.assign({i}, w));

W.forEach(w=>{

function tMin(t){
  const m = /(\d{1,2}):(\d{2})\s*(AM|PM)?/i.exec(t||""); if(!m) return null;
  let h=+m[1]; const mi=+m[2], ap=(m[3]||"").toUpperCase();
  if(ap==="PM" && h!==12) h+=12; else if(ap==="AM" && h===12) h=0; else if(!ap && h<7) h+=12;
  return h*60+mi;
}
const hhmm = m=>{ let h=Math.floor(m/60), mi=m%60; const ap=h>=12?"PM":"AM"; h=h%12||12; return h+":"+String(mi).padStart(2,"0")+" "+ap; };
function kindOf(t){
  const s=t.toLowerCase();
  if(/coffee|break|lunch|poster|exhibit|demo session/.test(s)) return "brk";
  if(/panel|debate|discussion|breakout|q&a|fishbowl|roundtable|forum|vote/.test(s)) return "pan";
  if(/invited|keynote|talk|speaker|tutorial|exercise|lecture/.test(s)) return "tlk";
  if(/oral|spotlight|lightning|paper|presentation/.test(s)) return "pap";
  return "oth";
}
const KIND = {tlk:"Talk", pan:"Panel / discussion", pap:"Papers", brk:"Break / posters", oth:"Other"};
function layoutItems(w){
  const win = SLOTWIN[w.s];
  const its = w.it.map(([a,b,t],k)=>({k, s:tMin(a), e:b?tMin(b):null, a, b, t:t.replace(/^\d+\s*min\s*[|·:]\s*/i,"")})).filter(x=>x.s!=null).sort((x,y)=>x.s-y.s||x.k-y.k);
  its.forEach((x,j)=>{
    if(x.e==null || x.e<=x.s){ const nx=its.slice(j+1).find(y=>y.s>x.s); x.e = nx ? nx.s : Math.max(x.s+15, Math.min(x.s+30, win[1])); }
    if(x.e<=x.s) x.e = x.s+10;
    x.kind = kindOf(x.t);
  });
  const groups=[]; let g=[], gEnd=-1;
  its.forEach(x=>{ if(g.length && x.s>=gEnd){ groups.push(g); g=[]; gEnd=-1; } g.push(x); gEnd=Math.max(gEnd,x.e); });
  if(g.length) groups.push(g);
  groups.forEach(gr=>{ const lanes=[]; gr.forEach(x=>{ let l=lanes.findIndex(end=>end<=x.s); if(l<0){ l=lanes.length; lanes.push(0); } lanes[l]=x.e; x.lane=l; }); gr.forEach(x=>x.nl=lanes.length); });

}

function markdownExport(){
  const lines = ["# My CoRL 2026 board",""];
  DAYS.forEach(d=>{
    const ss = SESS.filter(s=>s.day===d[0]);
    let dayLines = [];
    GE.filter(e=>e.day===d[0] && EVK.includes(e.kind) && hasAny(e.id)).forEach(e=>{
      const m = marks[e.id]||{}, np = photosOf(e.id).length;
      dayLines.push("### "+fmt12(e.start)+" · "+e.title+(e.person?": "+e.person:"")+(e.venue?" ("+e.venue+")":""));
      dayLines.push("- "+(m.l?"♥ ":"")+evTalkTitle(e)+(np?" ("+np+" photo"+(np>1?"s":"")+")":""));
      if(m.n) dayLines.push("  - Note: "+m.n.replace(/\n+/g," "));
      dayLines.push("");
    });
    ss.forEach(s=>{
      const isPoster = s.kind==="poster";
      const l = P.filter(p=>hasAny(p.id) && (isPoster?p.ps===s.code:p.ts===s.code)).sort((a,b)=>isPoster?a.n-b.n:a.t.localeCompare(b.t));
      if(!l.length) return;
      dayLines.push("### "+s.time+" · "+(isPoster?s.label:s.label+": "+s.theme)+" ("+s.venue+")");
      l.forEach(p=>{
        const m=marks[p.id]||{}; const tag=(m.l?"♥":"")+(m.f?"⚑":""); const np=photosOf(p.id).length;
        dayLines.push("- "+(tag?tag+" ":"")+(isPoster?"#"+p.n+(p.room?" "+p.room.name:"")+" · ":"")+p.t+" — "+p.a.slice(0,3).map(i=>A[i]).join(", ")+(p.a.length>3?" et al.":"")+" — https://openreview.net/forum?id="+p.id+(np?" ("+np+" photo"+(np>1?"s":"")+")":""));
        if(m.n) dayLines.push("  - Note: "+m.n.replace(/\n+/g," "));
        highlightedSentences(p.id).forEach(s=>dayLines.push("  > "+s));
      });
      dayLines.push("");
    });
    if(dayLines.length){ lines.push("## "+d[1]+", "+d[3],""); lines.push(...dayLines); }
  });
  const gw = W.filter(isGoing).sort((a,b)=>a.s.localeCompare(b.s));
  if(gw.length){
    lines.push("## Thursday, Nov 12 · Workshops","");
    gw.forEach(w=>lines.push("- "+SLOT[w.s][1]+" · "+w.t+" — "+w.v+", "+w.r+(w.u?" — "+w.u:"")));
    lines.push("");
  }
  const favs = favPeople();
  if(favs.length){
    lines.push("## People","");
    favs.forEach(([i,e])=>lines.push("- "+(e.l?"♥ ":"")+A[i]+" ("+aPapers[i].length+" paper"+(aPapers[i].length>1?"s":"")+" at CoRL)"+(e.n?" — "+e.n.replace(/\n+/g," "):"")));
    lines.push("");
  }
  return lines.join("\n");
}

  if(more.length) html += '<h3>More from these authors</h3><div class="rows">'+more.map(q=>rowHTML(q,"list")).join("")+'</div>';

const tipEl = $("#tip");
function tip(e, html){ tipEl.innerHTML=html; tipEl.hidden=false; moveTip(e); }
function moveTip(e){ const x=e.clientX, y=e.clientY, w=tipEl.offsetWidth, h=tipEl.offsetHeight; tipEl.style.left=Math.max(8,Math.min(innerWidth-w-8,x+14))+"px"; tipEl.style.top=Math.max(8,(y+h+20>innerHeight? y-h-12 : y+16))+"px"; }
function hideTip(){ tipEl.hidden=true; }
let toastT=null;
function toast(t){ const el=$("#toast"); el.textContent=t; el.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>el.hidden=true, 1600); }

document.addEventListener("click", e=>{
  const t = e.target.closest("button,a"); if(!t) return;
  if(t.dataset.mark){ e.preventDefault(); toggleMark(t.dataset.pid, t.dataset.mark); return; }
  if(t.dataset.likeperson!=null){ togglePerson(+t.dataset.likeperson); return; }
  if(t.dataset.abs){ toggleAbs(t); return; }
  if(t.dataset.evnoteopen){ const id=t.dataset.evnoteopen; st.evNoteOpen=id; refreshEvBoxes(id); const ta=document.querySelector('[data-evnote="'+id+'"]'); if(ta) ta.focus(); return; }
  if(t.id==="t-abs"){ st.showAbs=!st.showAbs; saveUI(); syncChips(); render(); return; }
  if(t.dataset.going!=null){ toggleGoing(+t.dataset.going); return; }
  if(t.dataset.tl){ hideTip(); showTlDetail(t.dataset.tl); return; }
  if(t.hasAttribute("data-tlclose")){ $("#tl-detail").hidden=true; return; }
  if(t.hasAttribute("data-tlive")){ st.tprev=null; render(); return; }
  if(t.dataset.wslot){ st.wslot=t.dataset.wslot; render(); return; }
  if(t.dataset.wmine){ st.wmine=!st.wmine; render(); return; }
  if(t.hasAttribute("data-wclear")){ st.wq=""; st.wterms=[]; st.wloc=""; st.wslot="all"; st.wmine=false; render(); return; }
  if(t.dataset.open){ openDrawer(t.dataset.open); return; }
  if(t.classList.contains("dclose")){ closeDrawer(); return; }
  if(t.dataset.author!=null){ if(!$("#drawer").hidden) closeDrawer(); selectAuthor(+t.dataset.author); return; }
  if(t.dataset.topic!=null){ if(!$("#drawer").hidden) closeDrawer(); st.topic=+t.dataset.topic; $("#topic").value=st.topic; if(st.view!=="topics") location.hash="topics"; else { render(); jumpTo("topic-list"); } return; }
  if(t.dataset.settopic!=null){
    const v=+t.dataset.settopic; st.topic = (v===st.topic && !t.dataset.jump) ? -1 : v; $("#topic").value=st.topic; render();
    if(st.topic>=0) jumpTo(t.dataset.jump ? "g-"+t.dataset.jump : "topic-list"); return;
  }
  if(t.dataset.day){ st.day=t.dataset.day; saveUI(); render(); return; }
  if(t.dataset.type){ const k=t.dataset.type; if(st.types.has(k)&&st.types.size>1) st.types.delete(k); else st.types.add(k); syncChips(); render(); return; }
  if(t.id==="t-mine"){ st.mine=!st.mine; syncChips(); render(); return; }
  if(t.id==="clear" || t.hasAttribute("data-clear")){ clearFilters(); return; }
  if(t.dataset.graph){ st.graph=t.dataset.graph; saveUI(); render(); return; }
  if(t.dataset.mineshow){ st.mineShow=t.dataset.mineshow; render(); return; }
  if(t.dataset.start){ if(t.dataset.start==="orals"){ st.types=new Set(["O"]); st.day="all"; syncChips(); } location.hash="schedule"; if(st.view==="schedule") render(); return; }
  if(t.id==="copy-md"){ copyMarkdown(); return; }
});

  if(!$("#drawer").hidden) closeDrawer();
  hideTip(); render();
  if(changed) window.scrollTo({top:0});
}

/* ---------- init ---------- */
(function init(){
  $("#m-count").textContent = P.length;
  const sel=$("#topic");
  sel.innerHTML = '<option value="-1">All topics</option>'+catOrder.map(i=>'<option value="'+i+'">'+esc(catLabel(i))+' ('+P.filter(p=>p.c===i).length+')</option>').join("");
  ["O","S","P"].forEach(k=>{ $("#t-"+k).querySelector(".mono").textContent = P.filter(p=>p.v===k).length; });
  // location menu built from the schedule: each hotel, then each poster room
  const venues = [...new Set(SESS.map(s=>s.venue))];
  const rooms = new Map(); SESS.forEach(s=>s.rooms.forEach(r=>{ const k=r[2]; const o=rooms.get(k)||{floor:r[3],lo:r[0],hi:r[1],venue:s.venue}; o.lo=Math.min(o.lo,r[0]); o.hi=Math.max(o.hi,r[1]); rooms.set(k,o); }));
  const what = v=> SESS.filter(s=>s.venue===v).every(s=>s.kind==="poster") ? "posters" : "orals & spotlights";
  $("#loc").innerHTML = '<option value="">All locations</option>'
    + venues.map(v=>'<option value="v:'+esc(v)+'">'+esc(v)+' · '+what(v)+'</option>').join("")
    + [...rooms.entries()].map(([k,o])=>'<option value="r:'+esc(k)+'">'+esc(o.venue)+' · '+esc(k)+', '+esc(o.floor)+' (#'+o.lo+'–'+o.hi+')</option>').join("");
  updateMineCount();
  updateGoingCount();
  syncChips();
  route();
  idbReady = idbLoad();
  loadAbstracts();
})();
})();
</script>

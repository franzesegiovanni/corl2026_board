<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>CoRL 2026 Board cover</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
/* Cover image for social posts. ?f=wide (1200x627) or ?f=tall (1080x1350) */
:root{--ink:#14212d;--ink2:#9fb0c0;--accent:#ef8a3c;--paper:#f3f5f7}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--ink);overflow:hidden}
.c{position:relative;width:100%;height:100%;color:#fff;font-family:"IBM Plex Sans",system-ui,sans-serif;
  background:radial-gradient(1200px 600px at 85% 110%,#24384b 0%,transparent 60%),var(--ink)}
.txt{position:absolute;z-index:3}
h1{font-family:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;font-weight:700;margin:0;letter-spacing:-.02em;line-height:1}
h1 span{color:var(--accent)}
.tag{margin:.5em 0 0;color:#dbe4ec;line-height:1.35}
.meta{font-family:"IBM Plex Mono",ui-monospace,monospace;color:var(--ink2);letter-spacing:.06em;text-transform:uppercase}
.by{color:var(--ink2)}
.shot{position:absolute;border-radius:12px;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.08);background:var(--paper)}
.shot img{display:block;width:100%}
.phone{position:absolute;border-radius:34px;padding:9px;background:#0b1117;box-shadow:0 30px 70px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.12);z-index:2}
.phone img{display:block;width:100%;border-radius:26px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{border:1px solid rgba(255,255,255,.22);border-radius:99px;padding:5px 11px;color:#e6edf3}

/* wide 1200x627 */
.wide .txt{left:56px;top:54px;width:420px}
.wide h1{font-size:60px}
.wide .tag{font-size:19px}
.wide .meta{font-size:13px;margin-bottom:14px}
.wide .chips{margin-top:20px;font-size:13px;gap:7px}
.wide .by{position:absolute;left:56px;bottom:40px;font-size:15px;z-index:3}
.wide .shot{left:640px;top:62px;width:700px}
.wide .phone{left:505px;top:232px;width:182px}

/* tall 1080x1350 */
.tall .txt{left:72px;top:80px;right:72px}
.tall h1{font-size:96px}
.tall .tag{font-size:30px;max-width:22ch}
.tall .meta{font-size:18px;margin-bottom:20px}
.tall .chips{margin-top:30px;font-size:19px;gap:10px}
.tall .chips span{padding:7px 14px}
.tall .by{position:absolute;left:72px;bottom:56px;font-size:20px;z-index:3}
.tall .shot{left:72px;top:560px;width:1010px}
.tall .phone{right:60px;top:690px;width:300px}
</style></head>
<body><div class="c" id="c">
  <div class="txt">
    <div class="meta">Austin, Texas · November 9–12</div>
    <h1>CoRL <span>2026</span> Board</h1>
    <p class="tag">Every paper, poster and workshop at the Conference on Robot Learning, planned on your phone.</p>
    <div class="chips"><span>687 papers + abstracts</span><span>32 workshops</span><span>My Thursday timeline</span><span>Co-author network</span><span>Likes, notes &amp; poster photos</span></div>
  </div>
  <div class="shot"><img src="thursday.png" alt=""></div>
  <div class="phone"><img src="schedule-phone.png" alt=""></div>
  <div class="by">Created by Giovanni Franzese · free to use</div>
</div>
<script>document.getElementById("c").classList.add(new URLSearchParams(location.search).get("f")==="tall"?"tall":"wide");</script>
</body></html>
